site_name: "Digital Forensics"
site_description: "Memory and network forensics for OpenCyberRange"
site_url: ""
docs_dir: Workbook
site_dir: _site_forensics

theme:
  name: material
  palette:
    - scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
  font:
    text: Inter
    code: JetBrains Mono

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - stylesheets/extra.css?v=4

extra_javascript:
  - javascripts/mermaid-fix.js?v=4
  - javascripts/pdf-export.js?v=2
  - https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js

nav:
  - Home: index.md
  - "CH FOR01 -- Memory Forensics":
    - Introduction: CH_FOR01_Memory_Forensics/00_Introduction.md
    - "Windows Memory Analysis with Volatility": CH_FOR01_Memory_Forensics/01_Windows_Memory_Volatility.md
  - "CH FOR02 -- Network Forensics":
    - Introduction: CH_FOR02_Network_Forensics/00_Introduction.md
    - "VoIP Call Reconstruction": CH_FOR02_Network_Forensics/01_VoIP_Call_Reconstruction.md
