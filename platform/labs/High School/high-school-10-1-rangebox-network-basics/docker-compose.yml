services:
  network:
    mem_limit: 128m
    cpus: 0.15
    deploy:
      resources:
        limits:
          cpus: '0.15'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 64M
    build:
      context: ../_shared
      dockerfile: Dockerfile
    hostname: rangebox-network
    labels:
      ip_offset: "93"
    environment:
      LAB_MODE: "network"
      FLAG: "OCR{h34d3rs_t3ll_st0r13s}"
      TITLE: "RangeBox Network Basics"
      PORT: "8080"
    read_only: true
    tmpfs:
      - /tmp:size=8m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
