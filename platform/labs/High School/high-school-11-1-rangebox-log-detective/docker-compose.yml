services:
  logs:
    mem_limit: 128m
    cpus: 0.15
    deploy:
      resources:
        limits:
          cpus: '0.15'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 64M
    build:
      context: ../_shared
      dockerfile: Dockerfile
    hostname: rangebox-logs
    labels:
      ip_offset: "95"
    environment:
      LAB_MODE: "logs"
      FLAG: "OCR{l0gs_t3ll_th3_st0ry}"
      TITLE: "RangeBox Log Detective"
      PORT: "8080"
    read_only: true
    tmpfs:
      - /tmp:size:8m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
