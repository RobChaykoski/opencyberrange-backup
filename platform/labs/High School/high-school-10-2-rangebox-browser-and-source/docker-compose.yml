services:
  web:
    mem_limit: 128m
    cpus: 0.15
    deploy:
      resources:
        limits:
          cpus: '0.15'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 64M
    build:
      context: ../_shared
      dockerfile: Dockerfile
    hostname: rangebox-web
    labels:
      ip_offset: "94"
    environment:
      LAB_MODE: "browser"
      FLAG: "OCR{v13w_th3_s0urc3}"
      TITLE: "RangeBox Browser and Source"
      PORT: "8080"
    read_only: true
    tmpfs:
      - /tmp:size=8m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
