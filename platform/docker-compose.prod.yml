# ============================================================
# OpenCyberRange — Production Docker Compose
# ============================================================
# Usage:
#   cp .env.example .env   # fill in all values
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml exec backend python /app/app/scripts/init_platform.py
#
# Differences from development docker-compose.yml:
#   - Backend code is baked into the image (no bind mount)
#   - Frontend is built at image build time
#   - No default credentials — .env is required
# ============================================================

services:
  db:
    image: postgres:15-alpine
    container_name: ocr-db
    entrypoint: ["/usr/local/bin/ensure-db-password.sh"]
    # Overriding entrypoint clears the image CMD, so the server argument must
    # come back explicitly or the container exits before PostgreSQL starts.
    command: ["postgres"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: UTC
      PGTZ: UTC
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/ensure-db-password.sh:/usr/local/bin/ensure-db-password.sh:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: ocr-redis
    # Rate-limit counters are ephemeral: no RDB snapshots, no AOF. A restart
    # only resets the current windows.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ocr-backend
    ports:
      - "127.0.0.1:8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRATION_HOURS: ${JWT_EXPIRATION_HOURS:-24}
      # First-run admin creation is token-gated when this is set. Generate one
      # for internet-facing installs so a stranger cannot claim the admin
      # account between startup and the operator opening the setup wizard.
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      WG_SERVER_ENDPOINT: ${WG_SERVER_ENDPOINT}
      WG_SERVER_PUBLIC_KEY: ${WG_SERVER_PUBLIC_KEY}
      WG_API_URL: ${WG_API_URL}
      WG_API_KEY: ${WG_API_KEY}
      WG_ENCRYPTION_KEY: ${WG_ENCRYPTION_KEY}
      WG_NETWORK_BASE: ${WG_NETWORK_BASE:-10.100}
      WG_CLIENT_BASE: ${WG_CLIENT_BASE:-10.0.0}
      LABS_HOST_PATH: ${LABS_HOST_PATH}
      SERVER_PUBLIC_HOST: ${SERVER_PUBLIC_HOST:-localhost}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://localhost}
      # Shared counter store so every worker enforces the same limits. Keep
      # the default when running redis; set "memory://" only for single-worker
      # development.
      RATELIMIT_STORAGE_URI: ${RATELIMIT_STORAGE_URI:-redis://redis:6379/0}
      TZ: UTC
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${LABS_HOST_PATH}:/labs:ro
      # Exercise Studio workbook state. The wiki itself is baked into the
      # frontend image; this volume only holds builder inputs/outputs.
      - workbook_data:/workbook
      # Exercise Studio template catalog lives outside the backend build context,
      # so it is mounted in read-only. The publish-gate linters are baked into
      # the backend image (app/services/workbook_linters), not mounted, so no
      # external/dev tooling directory is present in production.
      - ./templates:/app/templates:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ocr-frontend:latest
    container_name: ocr-frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certs:/etc/nginx/certs:ro
      - wiki_data:/usr/share/nginx/wiki:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # Works with both HTTP-only and self-signed HTTPS deployments.
      test: ["CMD-SHELL", "curl -fsSk https://127.0.0.1/ -o /dev/null || curl -fsSk http://127.0.0.1/ -o /dev/null"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # One-shot workbook builder. Run explicitly with:
  #   docker compose --profile tools run --rm wiki-builder
  # It writes the namespaced wiki tree into the wiki_data volume, which the
  # frontend mounts read-only. The frontend image no longer bakes wiki HTML.
  wiki-builder:
    build:
      context: ./wiki-builder
      dockerfile: Dockerfile
    image: ocr-wiki-builder:latest
    profiles: ["tools"]
    volumes:
      - ..:/repo:ro
      - wiki_data:/out
    environment:
      TZ: UTC
    restart: "no"

volumes:
  postgres_data:
  workbook_data:
  wiki_data:
